# PY Connect — Nginx reverse proxy configuration
# Deploy to /etc/nginx/sites-available/pyconnect and symlink into sites-enabled.
# Tested with nginx 1.24+ on Ubuntu 22.04/24.04.

# Upstream — backend Docker container listening on port 5000.
upstream pyconnect_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Rate limiting at proxy level (additional to app-level rate limiting).
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name pyconnect.run.place www.pyconnect.run.place;

    # Redirect all HTTP to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pyconnect.run.place www.pyconnect.run.place;

    # TLS — paths must match certbot/letsencrypt output.
    ssl_certificate /etc/letsencrypt/live/pyconnect.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyconnect.run.place/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max request body size (KYC uploads, images).
    client_max_body_size 10m;

    # --- WebSocket hubs (must be defined BEFORE the catch-all location) ---
    location /hubs/ {
        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket long-lived connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Auth endpoints (stricter rate limit) ---
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Vendor auth endpoints (stricter rate limit) ---
    location /api/vendor/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check (no rate limit, fast) ---
    location = /health {
        proxy_pass http://pyconnect_backend;
        access_log off;
    }

    # --- All other API traffic ---
    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
