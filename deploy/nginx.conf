# PY Connect — Nginx reverse proxy configuration (production)
# Deploy to /etc/nginx/sites-available/pondyconnect and symlink into sites-enabled.
# Certbot manages the SSL certificates and HTTP→HTTPS redirect.
# WebSocket upgrade map lives in /etc/nginx/conf.d/websocket.conf.

include /etc/nginx/conf.d/websocket.conf;

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

upstream pyconnect_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pyconnect.run.place;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pyconnect.run.place;

    ssl_certificate /etc/letsencrypt/live/pyconnect.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyconnect.run.place/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --- Redirects for legacy paths ---
    location = /admin { return 301 /; }
    location = /admin/ { return 301 /; }
    location = /vendor { return 301 /partner/; }
    location = /vendor/ { return 301 /partner/; }

    # --- Privacy policy static page ---
    location = /privacy-policy {
        alias /var/www/static/privacy-policy.html;
        default_type text/html;
    }

    # --- Auth endpoint rate limiting (more specific than /api/) ---
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API proxy ---
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check ---
    location /health {
        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SignalR hubs (WebSocket support) ---
    location /hubs/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://pyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Partner web app at /partner/ ---
    location /partner/assets/ {
        alias /var/www/partner/assets/;
        try_files $uri =404;
    }
    location /partner/icons/ {
        alias /var/www/partner/icons/;
        try_files $uri =404;
    }
    location /partner/canvaskit/ {
        alias /var/www/partner/canvaskit/;
        try_files $uri =404;
    }
    location /partner/ {
        alias /var/www/partner/;
        try_files $uri $uri/ /partner/index.html;
    }

    # --- Admin web app at root ---
    location /assets/ {
        root /var/www/admin;
        try_files $uri =404;
    }
    location /icons/ {
        root /var/www/admin;
        try_files $uri =404;
    }
    location /canvaskit/ {
        root /var/www/admin;
        try_files $uri =404;
    }
    location / {
        root /var/www/admin;
        try_files $uri $uri/ /index.html;
    }
}
