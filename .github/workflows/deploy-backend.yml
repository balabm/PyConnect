name: Deploy Backend to EC2

# Builds the .NET API Docker image, pushes to Docker Hub, and
# restarts the container on the EC2 instance via SSH.
#
# Required GitHub repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub username (balabm)
#   DOCKERHUB_TOKEN     - Docker Hub access token
#   EC2_HOST            - EC2 public IP (16.16.120.192)
#   EC2_USER            - SSH user (ubuntu)
#   EC2_SSH_KEY         - PEM private key content

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  IMAGE_NAME: balabm/pondyconnect-api

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/docker-compose.prod.yml
          target: ~/pondyconnect-backend/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/pondyconnect-backend
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 10
            # Check container is running (not in restart loop from migration failure)
            STATE=$(docker inspect -f '{{.State.Running}}' pondyconnect_api 2>/dev/null || echo "false")
            if [ "$STATE" != "true" ]; then
              echo "Container not running — checking logs for migration failure..."
              docker logs --tail 50 pondyconnect_api 2>&1
              exit 1
            fi
            curl -sf http://localhost:5000/health || exit 1
            echo "Health check passed"
