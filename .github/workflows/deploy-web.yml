name: Deploy Web Apps to EC2

# Builds the Admin and Partner Flutter web apps and deploys them
# to the EC2 instance via SSH/SCP. Nginx serves them at:
#   - Admin:   https://pyconnect.run.place/
#   - Partner: https://pyconnect.run.place/partner/
#
# Required GitHub repository secrets:
#   EC2_HOST      - EC2 public IP (16.16.120.192)
#   EC2_USER      - SSH user (ubuntu)
#   EC2_SSH_KEY   - PEM private key content
#   API_BASE_URL  - Production API base URL (https://pyconnect.run.place)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/lib/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - '.github/workflows/deploy-web.yml'

  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

# NOTE: The backend deploy (deploy-backend.yml) and this web deploy can both
# trigger on the same push. On the resource-constrained EC2 (~908MB RAM),
# simultaneous Docker pulls + SCP transfers can freeze the instance.
# If this becomes a recurring problem, add a workflow_run gate or serialize
# the deployments via a single orchestrating workflow.

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build-and-deploy:
    name: Build & Deploy Web Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # --- Admin: build, then immediately deploy before partner overwrites build/web ---
      - name: Build Admin web app
        working-directory: mobile
        run: |
          flutter build web \
            --target lib/main_admin.dart \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=APP_FLAVOR=admin \
            --release

      - name: Deploy Admin web app
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo rm -rf /var/www/admin/* && mkdir -p /tmp/admin-web"
          scp -i ~/.ssh/ec2_key -r mobile/build/web/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/admin-web/
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo cp -r /tmp/admin-web/* /var/www/admin/ && sudo chown -R www-data:www-data /var/www/admin/ && sudo chmod -R a+rX /var/www/admin/ && rm -rf /tmp/admin-web"

      # --- Partner: build (overwrites build/web), then deploy ---
      - name: Build Partner web app
        working-directory: mobile
        run: |
          flutter build web \
            --target lib/main_partner.dart \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=APP_FLAVOR=partner \
            --release \
            --base-href /partner/

      - name: Deploy Partner web app
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo rm -rf /var/www/partner/* && mkdir -p /tmp/partner-web"
          scp -i ~/.ssh/ec2_key -r mobile/build/web/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/partner-web/
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo cp -r /tmp/partner-web/* /var/www/partner/ && sudo chown -R www-data:www-data /var/www/partner/ && sudo chmod -R a+rX /var/www/partner/ && rm -rf /tmp/partner-web"

      - name: Reload Nginx
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl reload nginx"
