name: Build Mobile Apps

# Builds signed Android APKs and AABs for all 3 flavors
# (consumer, driver, partner) and uploads them as
# GitHub Actions artifacts.
#
# Trigger: tag pushes matching v* (e.g. v1.0.0) or manual run.
#
# Required GitHub repository secrets:
#   KEYSTORE_BASE64        - Base64-encoded .jks keystore file
#   KEY_STORE_PASSWORD     - Keystore store password
#   KEY_PASSWORD           - Key password
#   KEY_ALIAS              - Key alias (e.g. "upload")
#   GOOGLE_SERVICES_JSON   - Content of merged google-services.json
#   API_BASE_URL           - Production API base URL

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.0'
  API_BASE_URL: 'https://pyconnect.run.place'

jobs:
  build-mobile:
    name: Build APKs & AABs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Decode signing keystore
        working-directory: mobile/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/pondyconnect-upload.jks
          cat > key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/pondyconnect-upload.jks
          EOF

      - name: Place google-services.json
        working-directory: mobile/android
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Build Consumer APK + AAB
        working-directory: mobile
        run: |
          flutter build apk --flavor consumer --target lib/main.dart \
            --release --dart-define=APP_FLAVOR=consumer \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          flutter build appbundle --flavor consumer --target lib/main.dart \
            --release --dart-define=APP_FLAVOR=consumer \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Build Driver APK + AAB
        working-directory: mobile
        run: |
          flutter build apk --flavor driver --target lib/main_driver.dart \
            --release --dart-define=APP_FLAVOR=driver \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          flutter build appbundle --flavor driver --target lib/main_driver.dart \
            --release --dart-define=APP_FLAVOR=driver \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Build Partner APK + AAB
        working-directory: mobile
        run: |
          flutter build apk --flavor partner --target lib/main_partner.dart \
            --release --dart-define=APP_FLAVOR=partner \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          flutter build appbundle --flavor partner --target lib/main_partner.dart \
            --release --dart-define=APP_FLAVOR=partner \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pondyconnect-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pondyconnect-aabs
          path: mobile/build/app/outputs/bundle/*Release/*.aab
          retention-days: 30

      - name: Clean up secrets
        if: always()
        working-directory: mobile/android
        run: |
          rm -f key.properties app/pondyconnect-upload.jks app/google-services.json
