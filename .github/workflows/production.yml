name: Production CI/CD

# Production build pipeline: builds, tests, and publishes artifacts for
# both the .NET backend (Docker image to Docker Hub) and the Flutter
# mobile apps (signed Android App Bundles as GitHub artifacts).
#
# Trigger: push to main branch.
#
# Required GitHub repository secrets:
#   DOCKERHUB_USERNAME      - Docker Hub username (balabm)
#   DOCKERHUB_TOKEN         - Docker Hub access token
#   KEYSTORE_BASE64         - Base64-encoded .jks keystore file
#   KEY_STORE_PASSWORD      - Keystore store password
#   KEY_PASSWORD            - Key password
#   KEY_ALIAS               - Key alias (e.g. "upload")
#   GOOGLE_SERVICES_JSON    - Content of merged google-services.json
#   API_BASE_URL            - Production API base URL
#   RAZORPAY_KEY_ID         - Razorpay public key id

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  API_BASE_URL: 'https://pyconnect.run.place'
  IMAGE_NAME: balabm/pondyconnect-api

jobs:
  backend:
    name: Backend — Build, Test & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Architecture tests
        working-directory: backend
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~Architecture" --logger "console;verbosity=detailed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  mobile:
    name: Mobile — Analyze, Test & Build Signed AABs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: mobile/.dart_pub_cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Decode signing keystore
        working-directory: mobile/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/pondyconnect-upload.jks
          cat > key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/pondyconnect-upload.jks
          EOF

      - name: Place google-services.json
        working-directory: mobile/android
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Build Consumer AAB
        working-directory: mobile
        run: |
          flutter build appbundle --flavor consumer --target lib/main.dart \
            --release --dart-define=APP_FLAVOR=consumer \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Build Driver AAB
        working-directory: mobile
        run: |
          flutter build appbundle --flavor driver --target lib/main_driver.dart \
            --release --dart-define=APP_FLAVOR=driver \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Build Partner AAB
        working-directory: mobile
        run: |
          flutter build appbundle --flavor partner --target lib/main_partner.dart \
            --release --dart-define=APP_FLAVOR=partner \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyconnect-aabs
          path: mobile/build/app/outputs/bundle/*Release/*.aab
          retention-days: 30

      - name: Clean up secrets
        if: always()
        working-directory: mobile/android
        run: |
          rm -f key.properties app/pondyconnect-upload.jks app/google-services.json
